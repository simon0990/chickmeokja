    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
    }

    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: #f0a500; }
    .subtitle { font-size: 1rem; color: #888; margin-bottom: 2.5rem; }

    .result-area {
      min-height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .brand-badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 1rem;
      background: #3a2a1a;
      color: #f0a500;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
    }

    .brand-badge.show { opacity: 1; transform: translateY(0); }

    .menu-name {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.4;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      min-height: 3rem;
      padding: 0 1rem;
    }

    .menu-name.show { opacity: 1; transform: scale(1); }

    .pick-btn {
      background: #f0a500;
      color: #1a1a2e;
      border: none;
      padding: 1rem 3rem;
      font-size: 1.3rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pick-btn:hover {
      background: #d4940a;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(240, 165, 0, 0.3);
    }

    .pick-btn:active { transform: translateY(0); }
    .pick-btn.rolling { animation: shake 0.1s infinite; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    .counter { margin-top: 2rem; font-size: 0.8rem; color: #555; }

    .rolling-text { animation: fadeInOut 0.08s infinite; }
    @keyframes fadeInOut {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .brand-filter {
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      justify-content: center;
      max-width: 500px;
    }

    .brand-filter button {
      background: #2a2a3e;
      color: #888;
      border: 1px solid #333;
      padding: 0.25rem 0.55rem;
      font-size: 0.7rem;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .brand-filter button:hover { border-color: #f0a500; color: #f0a500; }
    .brand-filter button.active { background: #3a2a1a; color: #f0a500; border-color: #f0a500; }
  </style>
</head>

    // Brand list
    const brands = [...new Set(chickens.map(c => c.brand))];
    let selectedBrands = new Set(brands);
    let isRolling = false;
    let pickCount = 0;
    let lastPickedIndex = -1;

    // Build brand filter buttons
    function buildFilter() {
      const container = document.getElementById('brandFilter');
      const allBtn = document.createElement('button');
      allBtn.textContent = '전체';
      allBtn.classList.add('active');
      allBtn.onclick = () => {
        selectedBrands = new Set(brands);
        updateFilterUI();
      };
      container.appendChild(allBtn);

      brands.forEach(brand => {
        const btn = document.createElement('button');
        btn.textContent = brand;
        btn.classList.add('active');
        btn.onclick = () => {
          if (selectedBrands.size === brands.length) {
            // If all selected, select only this one
            selectedBrands = new Set([brand]);
          } else if (selectedBrands.has(brand)) {
            selectedBrands.delete(brand);
            if (selectedBrands.size === 0) selectedBrands = new Set(brands);
          } else {
            selectedBrands.add(brand);
          }
          updateFilterUI();
        };
        container.appendChild(btn);
      });
    }

    function updateFilterUI() {
      const buttons = document.querySelectorAll('.brand-filter button');
      const allBtn = buttons[0];
      if (selectedBrands.size === brands.length) {
        allBtn.classList.add('active');
      } else {
        allBtn.classList.remove('active');
      }
      for (let i = 1; i < buttons.length; i++) {
        if (selectedBrands.has(buttons[i].textContent)) {
          buttons[i].classList.add('active');
        } else {
          buttons[i].classList.remove('active');
        }
      }
      document.getElementById('counter').textContent = '';
    }

    function getFiltered() {
      return chickens.filter(c => selectedBrands.has(c.brand));
    }

    function pickChicken() {
      const filtered = getFiltered();
      if (filtered.length === 0 || isRolling) return;
      isRolling = true;

      const btn = document.getElementById('pickBtn');
      const menuName = document.getElementById('menuName');
      const badge = document.getElementById('brandBadge');

      btn.classList.add('rolling');
      badge.classList.remove('show');

      let rollCount = 0;
      const totalRolls = 20;
      const rollInterval = setInterval(() => {
        const random = filtered[Math.floor(Math.random() * filtered.length)];
        menuName.textContent = random.menu;
        menuName.classList.add('show');
        menuName.classList.add('rolling-text');
        rollCount++;

        if (rollCount >= totalRolls) {
          clearInterval(rollInterval);

          let finalIndex;
          do {
            finalIndex = Math.floor(Math.random() * filtered.length);
          } while (finalIndex === lastPickedIndex && filtered.length > 1);

          lastPickedIndex = finalIndex;
          const picked = filtered[finalIndex];

          menuName.classList.remove('rolling-text');
          menuName.textContent = picked.menu;
          menuName.classList.add('show');

          badge.textContent = picked.brand;
          badge.classList.add('show');

          btn.classList.remove('rolling');
          btn.textContent = '다시 고르기!';
          isRolling = false;

          pickCount++;
          document.getElementById('counter').textContent =
            `${selectedBrands.size === brands.length ? '전체' : [...selectedBrands].join(', ')} ${filtered.length}개 메뉴 중 ${pickCount}번째 선택`;
        }
      }, 60);
    }

    buildFilter();
